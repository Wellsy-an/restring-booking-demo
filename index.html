const allRooms=[...CFG.roomsF,...CFG.roomsM];
const memory={};
const StorageAdapter={persistent:true,read(key,fallback){try{const raw=localStorage.getItem(key);return raw===null?fallback:JSON.parse(raw)}catch(e){this.persistent=false;return key in memory?JSON.parse(memory[key]):fallback}},write(key,value){memory[key]=JSON.stringify(value);try{localStorage.setItem(key,memory[key])}catch(e){this.persistent=false}},remove(key){delete memory[key];try{localStorage.removeItem(key)}catch(e){this.persistent=false}}};
const KEY='restring_demo_v3';
function freshState(){return {users:Object.fromEntries(DIRECTORY.map(u=>[u.id,{credit:CFG.startCredit,violations:0,banUntil:null,notices:[]}])),bookings:[],events:[],settings:{sid:DIRECTORY[0].id,lang:'en',ignoreClock:false,ignoreCalendar:false}}}
function loadState(){const x=StorageAdapter.read(KEY,null);if(!x||!x.users||!Array.isArray(x.bookings)||!x.settings)return freshState();const fresh=freshState();for(const u of DIRECTORY){const p=x.users[u.id];if(p&&Number.isFinite(p.credit)&&Array.isArray(p.notices))fresh.users[u.id]={...fresh.users[u.id],...p}}return {...fresh,...x,users:fresh.users,events:Array.isArray(x.events)?x.events:[],settings:{...fresh.settings,...x.settings,sid:DIRECTORY.some(u=>u.id===x.settings.sid)?x.settings.sid:DIRECTORY[0].id,lang:x.settings.lang==='zh'?'zh':'en'}}}
let state=loadState();
const persist=()=>StorageAdapter.write(KEY,state);
const clock={now:()=>new Date()};
const dstr=(date=clock.now())=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Shanghai',year:'numeric',month:'2-digit',day:'2-digit'}).format(date);
const pd=ds=>new Date(ds+'T00:00:00+08:00');
const validDate=ds=>/^\d{4}-\d{2}-\d{2}$/.test(ds)&&Number.isFinite(pd(ds).getTime())&&dstr(pd(ds))===ds;
const weekday=ds=>new Date(ds+'T12:00:00+08:00').getUTCDay();
function addDays(ds,n){return dstr(new Date(pd(ds).getTime()+n*864e5))}
const at=(ds,h)=>new Date(ds+'T'+String(h).padStart(2,'0')+':00:00+08:00');
function idInfo(id){return CFG.idPattern.test(id)?{ok:true,cohort:'20'+id.slice(0,2)}:{ok:false}}
const roomsFor=g=>g==='F'?CFG.roomsF:g==='M'?CFG.roomsM:[];
const eligible=u=>!!u&&idInfo(u.id).ok&&u.campus==='II'&&roomsFor(u.gender).length>0;
const SchoolAPI={getDirectory:()=>DIRECTORY.map(x=>({...x})),getCurrentStudent:()=>({...DIRECTORY.find(u=>u.id===state.settings.sid),...state.users[state.settings.sid]}),switchStudent(sid){if(!DIRECTORY.some(u=>u.id===sid))return false;state.settings.sid=sid;persist();return true}};
const me=()=>SchoolAPI.getCurrentStudent();
function phaseInfo(ds){const sem=CAL.sems.find(s=>ds>=s.open&&ds<=s.end);if(!sem)return {sem:null,phase:ds<CAL.sems[0].open||ds>CAL.sems[1].end?'phaseUnknown':'phaseBreak'};let phase=ds>sem.openEnd?'phaseBreak':ds>=sem.examStart?'phaseExams':ds>sem.classesEnd?'phaseRevision':CAL.reading.some(([a,b])=>ds>=a&&ds<=b)?'phaseReading':'phaseTeaching';return {sem,phase}}
function dayInfo(ds){if(!validDate(ds))return {open:false,reason:'INVALID'};const info=phaseInfo(ds);if(POLICY.closedWeekdays.includes(weekday(ds)))return {...info,open:false,reason:'CLOSED_DAY'};if(POLICY.useAcademicClosures){const s=CAL.sems.find(x=>ds>=x.open&&ds<=x.openEnd);if(!s)return {...info,open:false,reason:'phaseBreak'};if(!CAL.makeup.includes(ds)&&CAL.holidays.some(([a,b])=>ds>=a&&ds<=b))return {...info,open:false,reason:'phaseBreak'}}return {...info,open:true}}
function nextOpenDay(from){for(let n=1;n<740;n++){const ds=addDays(from,n);if(dayInfo(ds).open)return ds}return null}
function semEnd(now=clock.now()){const ds=dstr(now),s=CAL.sems.find(x=>x.end>=ds);if(s)return s.end+'T23:59:59+08:00';/* Future years: configured semester dates are NOT silently extrapolated. */return null}
const yearEnd=()=>CAL.sems[CAL.sems.length-1].end+'T23:59:59+08:00';
const tierOf=c=>c<=150?'year':c<=200?'sem':c<=250?'month':c<=300?'warn':'none';
const banActive=(u=me(),now=clock.now())=>!!u.banUntil&&(u.banUntil==='calendar-required'||new Date(u.banUntil)>now);

const active=b=>b.status!=='cancelled';

const dailyLimit=u=>u.credit>=CFG.maxCredit?2:1;
const currentBooking=(date,sid=me().id)=>dailyBookings(date,sid)[0];
function hash(s){let n=2166136261;for(let i=0;i<s.length;i++)n=Math.imul(n^s.charCodeAt(i),16777619);return n>>>0}
// Reserve one reproducible, unseeded two-hour bed in each gender pool.
// 78% raw occupancy becomes about 75% after these baseline demo openings.
function demoGuaranteedBed(date,gender){const pool=roomsFor(gender).flatMap(r=>Array.from({length:6},(_,i)=>r+'0'+(i+1)));return pool[hash(date+'|demo-open|'+gender)%pool.length]}
const seeded=(date,bed,slot)=>bed!==demoGuaranteedBed(date,CFG.roomsF.includes(bed[0])?'F':'M')&&hash(date+'|'+bed+'|'+slot)%10000<CFG.demoOccupancyRate*10000;
function takenBy(date,bed,slot){const b=bookings().find(b=>b.date===date&&b.bed===bed&&b.slot===slot&&active(b));if(b)return b.sid;if(bookings().some(x=>x.date===date&&x.bed===bed&&x.slot===slot&&x.status==='cancelled'))return null;return seeded(date,bed,slot)?'other':null}
const slotBy=id=>CFG.slots.find(s=>s.id===id);
const slotEnded=(date,slot,now=clock.now())=>now>=at(date,slot.end);
function canBook(user,bed,slotId,date){const slot=slotBy(slotId);if(!slot||!validDate(date)||typeof bed!=='string'||!allRooms.includes(bed.slice(0,1))||!/^[A-H]0[1-6]$/.test(bed))return 'INVALID';if(!eligible(user))return 'NOT_CAMPUS_II';if(!roomsFor(user.gender).includes(bed[0]))return 'WRONG_GENDER_ROOM';if(date<dstr())return 'PAST_DATE';if(!state.settings.ignoreCalendar&&!dayInfo(date).open)return 'CLOSED_DAY';if(banActive(user))return 'SUSPENDED';if(!state.settings.ignoreClock&&slotEnded(date,slot))return 'ENDED';const daily=dailyBookings(date,user.id);if(daily.some(b=>b.slot===slotId))return 'DUPLICATE_SLOT';if(daily.length>=dailyLimit(user))return 'DAILY_LIMIT';if(daily.some(b=>b.bed!==bed))return 'SAME_BED';if(takenBy(date,bed,slotId))return 'TAKEN';return 'OK'}
function uuid(){return typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'rr-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
const BookingAPI={
 create(sid,bed,slot,date){const result=this.createMany(sid,bed,[slot],date);return result.ok?{...result,booking:result.bookings[0]}:result},
 createMany(sid,bed,slots,date){state=loadStateFromLive();if(!Array.isArray(slots)||!slots.length||slots.length>2||new Set(slots).size!==slots.length)return {ok:false,code:'INVALID'};const student=DIRECTORY.find(u=>u.id===sid),user=student?{...student,...state.users[sid]}:null;const originalLength=state.bookings.length,created=[];for(const slot of [...slots].sort()){const code=canBook(user,bed,slot,date);if(code!=='OK'){state.bookings.length=originalLength;return {ok:false,code}}const booking={id:uuid(),sid,bed,slot,date,status:'booked',createdAt:clock.now().toISOString(),enteredAt:null,exitedAt:null,warnedAt:null,penalized:false,rewarded:false,rewardAmount:0};state.bookings.push(booking);created.push(booking)}persist();return {ok:true,bookings:created}},

function renderSidebar(){$('sidebar').innerHTML=`<p class="nav-label">${bi('services')}</p><button class="nav-item active" data-nav="workspace"><span aria-hidden="true">▦</span>${bi('navReserve')}</button><button class="nav-item" data-nav="myBookings"><span aria-hidden="true">▤</span>${bi('navBookings')}</button><button class="nav-item" data-nav="guidelines"><span aria-hidden="true">ⓘ</span>${bi('navRules')}</button><div class="aside-info"><b>${bi('asideTitle')}</b><p style="margin-top:7px;white-space:pre-line">${bi('asideText')}</p></div>`;$('sidebar').querySelectorAll('[data-nav]').forEach(el=>el.onclick=()=>$(el.dataset.nav)?.scrollIntoView({behavior:'smooth',block:'start'}))}
function renderCalendar(){const [y,m]=monthCursor.split('-').map(Number),first=monthCursor+'-01',offset=(weekday(first)+6)%7,days=new Date(Date.UTC(y,m,0)).getUTCDate();let cells=t('weekdays').map((w,i)=>`<span class="weekday">${pair(w,tz('weekdays')[i])}</span>`).join('')+'<span></span>'.repeat(offset);for(let n=1;n<=days;n++){const ds=monthCursor+'-'+String(n).padStart(2,'0'),closed=!dayInfo(ds).open,past=ds<dstr(),disabled=past||closed;cells+=`<button type="button" data-date="${ds}" class="${ds===selectedDate?'selected ':''}${ds===dstr()?'today':''}" ${disabled?'disabled':''} aria-label="${esc(dateText(ds)+' / '+dateText(ds,'zh')+(closed?' · '+ta('sun'):''))}" ${ds===selectedDate?'aria-pressed="true"':''}>${n}</button>`}return `<div class="calendar-top"><button data-month="-1" aria-label="${esc(ta('prevMonth'))}">‹</button><b>${pair(t('months')[m-1]+' '+y,y+'年 '+tz('months')[m-1])}</b><button data-month="1" aria-label="${esc(ta('nextMonth'))}">›</button></div><div class="calendar">${cells}</div>`}
function freeCount(slot){if(!eligible(me())||banActive()||(!state.settings.ignoreCalendar&&!dayInfo(selectedDate).open)||(!state.settings.ignoreClock&&slotEnded(selectedDate,slot)))return 0;return roomsFor(me().gender).reduce((n,r)=>n+Array.from({length:6},(_,i)=>r+'0'+(i+1)).filter(b=>!takenBy(selectedDate,b,slot.id)).length,0)}
function svgPair(en,zh,x,y,size=10,fill='#6887ae'){return `<text x="${x}" y="${y}" text-anchor="middle" fill="${fill}" font-size="${size}"><tspan x="${x}" lang="en">${esc(en)}</tspan><tspan x="${x}" dy="${size+3}" lang="zh-Hans" font-size="${Math.max(7,size-1)}">${esc(zh)}</tspan></text>`}
function renderMap(){return `<svg class="map-svg" viewBox="0 0 530 550" role="group" aria-label="${esc(ta('mapTitle'))}"><defs><pattern id="grass" width="13" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#d8e4f3"/></pattern></defs><circle cx="265" cy="260" r="232" fill="#fbfdff"/><circle cx="265" cy="260" r="205" fill="url(#grass)"/>${Array.from({length:24},(_,i)=>{const a=(i*15+7)*Math.PI/180,x=265+222*Math.cos(a),y=260+222*Math.sin(a);return `<circle cx="${x}" cy="${y}" r="${i%3===0?7:4}" fill="${i%2?'#c5dccb':'#d4e6d8'}"/>`}).join('')}<circle cx="265" cy="260" r="103" fill="white" stroke="#dce7f5" stroke-width="18"/><circle cx="265" cy="260" r="73" fill="#f2f7ff"/>${svgPair('REST RING','午间休息环',265,245,20,'#1c5299')}${svgPair('8 PODS · 48 BEDS','8 舱 · 48 床',265,291,9,'#8b9bb0')}${allRooms.map((r,i)=>{const a=-112.5+i*45,rad=a*Math.PI/180,x=265+157*Math.cos(rad),y=260+157*Math.sin(rad),allowed=roomsFor(me().gender).includes(r);return `<g class="map-room ${allowed?'':'locked'} ${selectedRoom===r?'selected':''}" data-room="${r}" role="button" tabindex="${allowed?'0':'-1'}" aria-disabled="${!allowed}" aria-label="${esc('Room '+r+' / 房间 '+r+' · '+(allowed?ta('bedTitle'):ta('locked')))}" aria-pressed="${selectedRoom===r}"><g transform="translate(${x},${y}) rotate(${a+90})"><rect x="-31" y="-53" width="62" height="106" rx="8" class="shell"/><path d="M-23 -44v88 M-15 -44v88 M-7 -44v88 M1 -44v88 M9 -44v88 M17 -44v88 M25 -44v88" opacity=".45" stroke="${allowed?'#b3cbee':'#d8dee7'}" fill="none"/><path d="M-26 36q12 -12 25 0t27 0 M-26 41q12 -10 25 0t27 0" fill="none" stroke="${allowed?'#8bbdb5':'#c7d1cf'}" stroke-width="2" opacity=".85"/><g opacity="${allowed?'.65':'.3'}"><circle cx="-20" cy="-34" r="5" fill="#c0d7e8"/><circle cx="-17" cy="-37" r="4" fill="#b9d7c5"/><circle cx="-16" cy="-32" r="2" fill="#e6c7a6"/></g><rect x="-11" y="48" width="22" height="5" rx="2" fill="${allowed?'#6a9bdd':'#bdc6d1'}"/></g><text x="${x}" y="${y}" text-anchor="middle" font-size="22" font-weight="750">${r}</text>${svgPair(allowed?'6 BEDS':'LOCKED',allowed?'6 床位':'已锁定',x,y+15,8)}</g>`}).join('')}${svgPair('Proposal-based concept · 6 × 3 × 3 m per pod','依据提案的概念示意，非施工图 · 每舱 6 × 3 × 3 米',265,522,9)}</svg>`}
function seatState(bed,slot){const mine=bookings().find(b=>b.sid===me().id&&b.date===selectedDate&&b.bed===bed&&b.slot===slot.id&&active(b));if(mine)return {kind:'mine',label:'mine'};if(!state.settings.ignoreClock&&slotEnded(selectedDate,slot))return {kind:'closed',label:'ended'};if(takenBy(selectedDate,bed,slot.id))return {kind:'full',label:'full'};const code=canBook(me(),bed,slot.id,selectedDate);return code==='OK'?{kind:'free',label:'available'}:{kind:'closed',label:'unavailable'}}
function renderBedPlan(){return `<div class="pod-plan"><div class="row between"><h4>${bi('bedPlanTitle')}</h4><span class="small muted">6 m × 3 m</span></div><div class="plan-slot-picker" role="group" aria-label="${esc(ta('time'))}">${CFG.slots.map(slot=>`<button data-plan-slot="${slot.id}" class="${planSlot===slot.id?'selected':''}" aria-pressed="${planSlot===slot.id}">${slot.label}</button>`).join('')}</div><div class="bunk-plan" aria-label="${esc('Three columns of upper and lower pod bunks / 三列上下铺豆荚床位')}">${[1,2,3].map(n=>`<div class="bunk-unit"><span class="bunk-caption">${pair('BUNK '+n,'上下铺 '+n)}</span>${[n+3,n].map((num,i)=>{const bed=selectedRoom+'0'+num,status=seatState(bed,slotBy(planSlot));return `<button type="button" class="bunk-bed pod-opening ${status.kind} ${i===0?'upper-pod':'lower-pod'}" data-plan-bed="${bed}" data-plan-time="${planSlot}" ${status.kind==='free'?'':'disabled'} aria-label="${esc(bed+' '+ta(i===0?'upper':'lower')+' '+slotBy(planSlot).label+' '+ta(status.label))}"><b>${bed}</b><span class="bunk-type">${bi(i===0?'upper':'lower')}</span><span class="pod-status">${bi(status.label)}</span><span class="pod-mattress" aria-hidden="true"></span>${i===0?'<span class="safety-rail" aria-hidden="true"></span>':''}</button>`}).join('')}</div>`).join('')}</div><div class="plan-measure" aria-hidden="true">← 6 m →</div><div class="plan-entrance">${bi('entrance')}</div><p class="small muted plan-caption">${bi('bedPlanNote')}</p></div>`}

function renderBeds(){return `${renderBedPlan()}<table class="beds"><thead><tr><th>${bi('bed')}</th>${CFG.slots.map(s=>`<th>${s.label}</th>`).join('')}</tr></thead><tbody>${Array.from({length:6},(_,i)=>{const bed=selectedRoom+'0'+(i+1);return `<tr><td>${bed}<small>${bi(i<3?'lower':'upper')}</small></td>${CFG.slots.map(s=>{const c=seatState(bed,s);return `<td><button class="seat ${c.kind}" data-bed="${bed}" data-slot="${s.id}" ${c.kind==='free'?'':'disabled'} aria-label="${esc(bed+' '+s.label+' '+ta(c.label))}">${bi(c.label)}</button></td>`}).join('')}</tr>`}).join('')}</tbody></table><p class="table-note">${bi('tableNote')}</p>`}
function bookingList(){const list=bookings().filter(b=>b.sid===me().id).sort((a,b)=>b.date.localeCompare(a.date)||a.slot.localeCompare(b.slot)||b.createdAt.localeCompare(a.createdAt));return `<section id="myBookings" class="card booking-card"><div class="card-head row between"><h3>${bi('myBookings')}</h3><span class="badge">${list.filter(b=>active(b)&&b.date>=dstr()).length}</span></div>${list.length?`<div class="entry-note booking-entry-note">${bi('entryRule')}</div>`+list.map(b=>{const cancel=b.status==='booked'&&clock.now()<at(b.date,slotBy(b.slot).start);return `<div class="booking-item"><div><b>${b.bed} &nbsp; · &nbsp; ${slotBy(b.slot).label}</b><div class="small muted">${dateLabel(b.date,true)}</div><div class="booking-status">${bi(b.status)}<span class="small muted">${bi('bookingSaved')}</span></div>${b.rewarded?`<p class="reward-label">${pair('Completion reward +'+b.rewardAmount,'正常完成奖励 +'+b.rewardAmount)}</p>`:''}</div>${cancel?`<button data-cancel="${b.id}" class="small">${bi('cancel')}</button>`:''}</div>`}).join(''):`<div class="card-body muted small">${bi('noBookings')}</div>`}</section>`}
function workspace(){if(!eligible(me()))return `<section class="state-screen" id="workspace"><div class="state-icon">⊘</div><h2>${bi('notEligible')}</h2><p>${bi('notEligibleP')}</p></section>`;if(banActive()){const until=me().banUntil,days=until==='calendar-required'?'—':Math.max(0,Math.ceil((new Date(until)-clock.now())/864e5));return `<section class="state-screen" id="workspace"><div class="state-icon">◷</div><h2>${bi('suspended')}</h2><p>${bi('until')}${untilLabel(until)}<b>${pair(days+' days remaining',days+' 天后恢复预约')}</b></p><p>${bi('suspendP')}</p></section>`}if(!state.settings.ignoreCalendar&&!dayInfo(selectedDate).open)return `<section class="state-screen" id="workspace"><h2>${bi('closedDay')}</h2><p>${bi('closedDayP')}</p><button id="nextOpen" class="primary">${bi('nextOpen')}</button><button id="preview">${bi('preview')}</button></section>`;return `<section class="workspace" id="workspace"><div class="card"><div class="card-head row between"><div><h3>${bi('mapTitle')}</h3><p class="muted small">${bi('mapSub')}</p></div><span class="room-label">${bi(me().gender==='F'?'women':'men')}</span></div><div class="map-body">${renderMap()}<div class="legend"><span><i class="dot" style="background:#4281d9"></i>${bi('yourPool')}</span><span><i class="dot closed"></i>${bi('locked')}</span></div></div></div><div class="card"><div class="card-head row between"><div><h3>${bi('bedTitle')}</h3><p class="small muted">${bi('bedSub')}</p></div><span class="room-label">${pair('Room '+selectedRoom,'房间 '+selectedRoom)}</span></div>${renderBeds()}<div class="legend" style="padding:0 12px 18px">${[['free','legendFree'],['full','legendFull'],['mine','legendMine'],['closed','legendClosed']].map(([c,k])=>`<span><i class="dot ${c}"></i>${bi(k)}</span>`).join('')}</div></div></section>`}
function identityHTML(){const u=me();return `<section class="identity"><div class="row"><div class="avatar">${u.name.slice(-2)}</div><div><h3>${studentName(u)}</h3><div class="identity-details">${pair('Gender: '+t(u.gender==='F'?'female':'male'),'性别：'+tz(u.gender==='F'?'female':'male'))}${pair('Student ID: '+u.id,'演示学号：'+u.id)}${pair('Intake: '+idInfo(u.id).cohort,'入学年级：'+idInfo(u.id).cohort)}${pair('Major: '+t(u.major),'专业：'+tz(u.major))}${pair('Campus '+u.campus+' resident',u.campus+' 期住宿生')}</div><p class="small muted">${bi('identity')}</p></div></div><div class="credit"><div>${bi('credit')}<b>${u.credit}</b><small> / 350</small></div><p class="small muted">${bi(banActive()?'activeBan':tierOf(u.credit)==='none'?'none':u.credit<=300?'warn':'none')}</p></div></section>`}
function renderMain(){const u=me(),quota=dailyLimit(u),used=dailyBookings(selectedDate).length;$('main').innerHTML=`<div class="breadcrumbs">${bi('crumb')}</div><section class="hero"><div><div class="eyebrow">${bi('heroTag')}</div><h1>${bi('heroTitle')}</h1><p>${bi('heroText')}</p></div><div class="hero-facts"><div><b>08</b>${bi('pods')}</div><div><b>48</b>${bi('beds')}</div><div><b>0${quota}</b>${bi('hour')}</div></div></section>${identityHTML()}<section class="credit-allowance"><div>${bi(u.credit>=350?'quotaFull':'quotaSingle')}<span class="small muted">${bi('rewardRule')}</span></div><b>${used} / ${quota}</b></section>${state.settings.ignoreClock||state.settings.ignoreCalendar?`<div class="notice-banner">${bi('simulation')}</div>`:''}<section class="date-section"><div class="card"><div class="card-head row between"><h3>${bi('chooseDate')}</h3><span class="small muted">${bi('dateNote')}</span></div><div class="card-body">${renderCalendar()}</div></div><div class="card"><div class="card-body"><div class="eyebrow muted">${bi('selection')}</div><div class="selected-date">${dateLabel(selectedDate)}</div><div class="small muted">${pair('Today: '+dateText(dstr(),'en',true),'今天：'+dateText(dstr(),'zh',true))}</div><div class="small muted">${bi('timezone')}</div><div style="margin-top:9px" class="badge">${phaseLabel(selectedDate)}</div><div class="slots-summary">${CFG.slots.map(s=>`<div class="slot-summary"><div class="small">${s.label}</div><b>${freeCount(s)}</b>${bi('freeBeds')}</div>`).join('')}</div><p class="small muted" style="margin-top:10px;font-size:10px">${bi('availabilityNote')}</p><p class="small muted occupancy-demo">${bi('occupancyDemo')}</p></div></div></section>${workspace()}${bookingList()}<section class="card policy" id="guidelines"><h3>${bi('guidelines')}</h3><div class="policy-grid">${[1,2,3].map(i=>`<div><b class="small">${bi('rule'+i)}</b><p>${bi('rule'+i+'p')}</p></div>`).join('')}</div><p class="small muted" style="margin-top:16px;font-size:10px">${bi('openNote')}</p><p class="small muted">${bi('checkInNote')}</p><p class="small muted">${bi('alreadyRetained')}</p></section><footer><div>${bi('footer')}<div style="margin-top:5px">${bi('calendarSource')}</div></div><button id="termsAgain" class="small">${bi('terms')}</button></footer>`;bindMain()}
function bindMain(){document.querySelectorAll('[data-plan-slot]').forEach(el=>el.onclick=()=>{planSlot=el.dataset.planSlot;renderMain()});document.querySelectorAll('[data-plan-bed]').forEach(el=>el.onclick=()=>{if(el.disabled)return;pending={bed:el.dataset.planBed,slot:el.dataset.planTime,date:selectedDate,sid:me().id};openModal('confirm')});document.querySelectorAll('[data-date]').forEach(el=>el.onclick=()=>{selectedDate=el.dataset.date;selectedActionId=null;renderMain();renderTools()});document.querySelectorAll('[data-month]').forEach(el=>el.onclick=()=>{const [y,m]=monthCursor.split('-').map(Number),d=new Date(Date.UTC(y,m-1+Number(el.dataset.month),1));monthCursor=d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0');renderMain()});document.querySelectorAll('[data-room]').forEach(el=>{const choose=()=>{if(!roomsFor(me().gender).includes(el.dataset.room))return;selectedRoom=el.dataset.room;renderMain();document.querySelector(`[data-room="${selectedRoom}"]`)?.focus()};el.onclick=choose;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}}});document.querySelectorAll('[data-bed]').forEach(el=>el.onclick=()=>{pending={bed:el.dataset.bed,slot:el.dataset.slot,date:selectedDate,sid:me().id};openModal('confirm')});document.querySelectorAll('[data-cancel]').forEach(el=>el.onclick=()=>{pending={id:el.dataset.cancel,sid:me().id};openModal('cancel')});if($('nextOpen'))$('nextOpen').onclick=()=>{selectedDate=nextOpenDay(selectedDate);monthCursor=selectedDate.slice(0,7);renderMain();renderTools()};if($('preview'))$('preview').onclick=()=>{state.settings.ignoreCalendar=true;persist();render()};$('termsAgain').onclick=()=>{entered=false;if($('gateRead'))$('gateRead').checked=false;closeModal();render();window.scrollTo({top:0,behavior:'smooth'})}}
function renderTools(){const actionList=dailyBookings(selectedDate),chosen=getEventBooking(selectedDate);$('toolsTitle').innerHTML=bi('tools');$('toolsPanel').innerHTML=`<div class="small muted">${bi('chooseStudent')}</div><div id="studentSelect" class="student-options" role="group" aria-label="${esc(ta('demoUser'))}">${DIRECTORY.map(u=>`<button data-student="${u.id}" class="${u.id===me().id?'chosen':''}" aria-pressed="${u.id===me().id}">${pair(u.name+' · '+t(u.gender==='F'?'female':'male')+' · Campus '+u.campus,'演示学生 '+u.name.slice(-2)+' · '+tz(u.gender==='F'?'female':'male')+' · '+u.campus+' 期')}</button>`).join('')}</div><label><input id="ignoreClock" type="checkbox" ${state.settings.ignoreClock?'checked':''}>${bi('ignoreClock')}</label><label><input id="ignoreCalendar" type="checkbox" ${state.settings.ignoreCalendar?'checked':''}>${bi('ignoreCal')}</label><div class="tool-records"><div class="small muted">${bi('slotRecord')}</div>${actionList.length?actionList.map(b=>`<button data-action-booking="${b.id}" class="${chosen?.id===b.id?'chosen':''}" aria-pressed="${chosen?.id===b.id}"><b>${b.bed} · ${slotBy(b.slot).label}</b>${bi(b.status)}</button>`).join(''):`<p class="small muted">${bi('noActionBooking')}</p>`}</div><div class="tool-buttons"><button data-door="entry">${bi('swipe')}</button><button data-door="exit">${bi('exit')}</button><button data-door="noshow">${bi('noShowTool')}</button><button data-door="overstay">${bi('overstayTool')}</button><button id="endBan">${bi('endBan')}</button><button id="reset">${bi('reset')}</button></div><p class="tool-info">${bi('toolInfo')}</p>`;document.querySelectorAll('[data-student]').forEach(el=>el.onclick=()=>{closeModal();SchoolAPI.switchStudent(el.dataset.student);selectedActionId=null;selectedRoom=roomsFor(me().gender)[0]||'A';render();showNotice()});document.querySelectorAll('[data-action-booking]').forEach(el=>el.onclick=()=>{selectedActionId=el.dataset.actionBooking;renderTools()});['ignoreClock','ignoreCalendar'].forEach(k=>$(k).onchange=e=>{state.settings[k]=e.target.checked;persist();if(!state.settings.ignoreCalendar&&!dayInfo(selectedDate).open){selectedDate=nextOpenDay(selectedDate);monthCursor=selectedDate.slice(0,7)}render()});document.querySelectorAll('[data-door]').forEach(el=>el.onclick=()=>{const b=getEventBooking(selectedDate);if(!b){toastKey('noCurrent');return}if(el.dataset.door==='entry'){const prepared=DoorAPI.prepareEntry(b.id);if(!prepared.ok){toastKey(prepared.code);return}pending={review:prepared.review};openModal('entryReview');return}const result=DoorAPI.record(el.dataset.door,b.id);if(!result.ok){toastKey(result.code);return}if(result.penalty){location.reload();return}if(el.dataset.door==='exit')selectedActionId=null;render();if(el.dataset.door==='exit'){if(result.cleanCompletion)toastPair('Normal completion · credit +'+result.rewardAmount+' (maximum 350)','正常完成 · 信用 +'+result.rewardAmount+'（上限 350）');else toastKey('noReward')}else toastKey(result.warning?'warnText':'swipeOk')});$('endBan').onclick=()=>{state.users[me().id].banUntil=null;persist();render();toastKey('endedBan')};$('reset').onclick=()=>openModal('reset')}
function render(){renderHeader();$('gate').classList.toggle('hidden',entered);$('app').classList.toggle('hidden',!entered);$('tools').classList.toggle('hidden',!entered);if(!entered){renderGate();return}renderSidebar();renderMain();renderTools()}
function toastPair(en,zh){$('toast').innerHTML=pair(en,zh);$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),4500)}
const toastKey=key=>toastPair(t(key),tz(key));
function detailsHTML(b){const slots=b.slots||[b.slot];return `<div class="detail"><div><span>${bi('date')}</span><b>${dateLabel(b.date,true)}</b></div><div><span>${bi('room')} / ${bi('bed')}</span><b>${b.bed[0]} / ${b.bed}</b></div><div><span>${bi('time')}</span><b id="modalTimeLabel">${slots.length===2?'11:00–13:00':slotBy(slots[0]).label}</b></div></div>`}
function openModal(kind){lastFocus=document.activeElement;modalKind=kind;renderModal();requestAnimationFrame(()=>document.querySelector('.modal button:not(:disabled),.modal input')?.focus())}
function closeModal(){modalKind=null;pending=null;$('modalRoot').innerHTML='';document.body.style.overflow='';if(lastFocus?.isConnected)lastFocus.focus()}
function renderModal(){if(!modalKind)return;let body='';if(modalKind==='entryReview'){const r=pending.review,u=DIRECTORY.find(x=>x.id===r.sid);body=`<div class="eyebrow muted">${pair('DEMO CARD REVIEW','模拟学生证复核')}</div><h2>${bi('entryReviewTitle')}</h2><p class="muted">${bi('entryReviewIntro')}</p><div class="detail entry-identity"><div><span>${bi('name')}</span><b>${studentName(u)}</b></div><div><span>${bi('studentId')}</span><b>${esc(r.sid)}</b></div></div>${detailsHTML(r)}<p class="entry-note">${bi('entryRule')}</p><p class="notice-banner">${bi('entryFace')}</p><label><input type="checkbox" id="entryReviewRead"><span>${bi('entryReviewRead')}</span></label><div class="modal-actions"><button data-close>${bi('back')}</button><button class="primary" id="confirmEntry" disabled>${bi('entryReviewConfirm')}</button></div>`}else if(modalKind==='confirm'){const canBoth=me().credit>=350&&CFG.slots.every(s=>canBook(me(),pending.bed,s.id,pending.date)==='OK');body=`<div class="eyebrow muted">${pair('RESTRING / RESERVATION','RESTRING / 预约确认')}</div><h2>${bi('confirmTitle')}</h2><p class="muted">${bi('confirmIntro')}</p>${detailsHTML(pending)}<p class="entry-note">${bi('entryRule')}</p>${canBoth?`<label class="both-slots"><input type="checkbox" id="bookBoth"><span>${bi('bookBoth')}<small class="muted">${bi('bookBothNote')}</small></span></label>`:''}<p class="notice-banner">${bi('penaltyReminder')}</p><label><input id="bookingRead" type="checkbox"><span>${bi('confirmRead')}</span></label><div class="modal-actions"><button data-close>${bi('back')}</button><button id="confirmBooking" class="primary" disabled>${bi('confirm')}</button></div>`}else if(modalKind==='cancel'){const b=bookings().find(b=>b.id===pending.id);body=`<h2>${bi('cancelTitle')}</h2><p>${bi('cancelText')}</p>${b?detailsHTML(b):''}<div class="modal-actions"><button data-close>${bi('back')}</button><button id="confirmCancel" class="primary">${bi('cancelConfirm')}</button></div>`}else if(modalKind==='reset'){body=`<h2>${bi('resetTitle')}</h2><p>${bi('resetText')}</p><div class="modal-actions"><button data-close>${bi('back')}</button><button id="confirmReset" class="primary">${bi('resetConfirm')}</button></div>`}else if(modalKind==='notice'){const n=me().notices[0];if(!n){closeModal();return}body=`<div class="eyebrow muted">${bi('deducted')}</div><h2>${bi('penaltyTitle')}</h2><div class="detail"><div><span>${bi('reason')}</span><b>${bi(n.reason)}</b></div><div><span>${bi('currentCredit')}</span><b>${n.credit} / 350</b></div></div><h3>${bi(n.tier)}</h3><p style="margin-top:10px">${n.banUntil?bi('until')+untilLabel(n.banUntil):bi(n.tier==='warn'&&n.credit===300?'noBan':'noticeNoSuspension')}</p><p class="small muted" style="margin-top:14px">${bi('noticeNext')}</p><div class="modal-actions"><button class="primary" id="ackNotice">${bi('ack')}</button></div>`}$('modalRoot').innerHTML=`<div class="modal-shade"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modalHeading">${body}</section></div>`;const heading=document.querySelector('.modal h2');if(heading)heading.id='modalHeading';document.body.style.overflow='hidden';document.querySelectorAll('[data-close]').forEach(el=>el.onclick=closeModal);if($('entryReviewRead'))$('entryReviewRead').onchange=e=>$('confirmEntry').disabled=!e.target.checked;if($('confirmEntry'))$('confirmEntry').onclick=()=>{if(!$('entryReviewRead').checked)return;const result=DoorAPI.confirmEntry(pending.review.token);closeModal();render();toastKey(result.ok?'swipeOk':result.code)};if($('bookBoth'))$('bookBoth').onchange=e=>$('modalTimeLabel').textContent=e.target.checked?'11:00–13:00':slotBy(pending.slot).label;if($('bookingRead'))$('bookingRead').onchange=e=>$('confirmBooking').disabled=!e.target.checked;if($('confirmBooking'))$('confirmBooking').onclick=()=>{if(!$('bookingRead').checked)return;const p={...pending},slots=$('bookBoth')?.checked?CFG.slots.map(s=>s.id):[p.slot],result=BookingAPI.createMany(p.sid,p.bed,slots,p.date);closeModal();render();toastKey(result.ok?'success':result.code)};if($('confirmCancel'))$('confirmCancel').onclick=()=>{const result=BookingAPI.cancel(pending.id,pending.sid);closeModal();render();toastKey(result.ok?'cancelSuccess':result.code)};if($('confirmReset'))$('confirmReset').onclick=()=>{state=freshState();persist();selectedDate=dstr();normalizeSelection();monthCursor=selectedDate.slice(0,7);selectedActionId=null;entered=false;closeModal();render()};if($('ackNotice'))$('ackNotice').onclick=()=>{state.users[me().id].notices.shift();persist();closeModal();render();showNotice()}}
function showNotice(){if(entered&&me().notices.length)openModal('notice')}
function boot(){persist();render();document.addEventListener('keydown',e=>{if(!modalKind)return;if(e.key==='Escape'){if(modalKind!=='notice')closeModal();return}if(e.key==='Tab'){const els=[...document.querySelectorAll('.modal button:not(:disabled),.modal input')];if(!els.length)return;const first=els[0],last=els[els.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});window.addEventListener('storage',e=>{if(e.key!==KEY)return;state=loadState();closeModal();normalizeSelection();render();showNotice()});setInterval(()=>{const day=dstr();if(day!==lastDay){const wasToday=selectedDate===lastDay;lastDay=day;if(wasToday||selectedDate<day){selectedDate=day;normalizeSelection();monthCursor=selectedDate.slice(0,7)}if(modalKind==='confirm')closeModal();render();if(entered)toastKey('dateUpdate')}else if(entered&&!modalKind)renderMain()},30000)}
if(!globalThis.__RR_TEST__)boot();

</script>
</body>
